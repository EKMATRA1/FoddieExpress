<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid Red Background as in image.png -->
  <rect width="1920" height="1080" fill="#EB1700" />
  
  <!-- Subtle ambient radial warm glow -->
  <radialGradient id="clocheGlow" cx="50%" cy="58%" r="45%">
    <stop offset="0%" stop-color="#FF3820" stop-opacity="0.4" />
    <stop offset="100%" stop-color="#EB1700" stop-opacity="0" />
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#clocheGlow)" />

  <g transform="translate(960, 580) scale(4.8)">
    <!-- 7 Radiating Sunburst / Steam Rays -->
    <!-- Ray 1: Far Left (horizontal) -->
    <line x1="-88" y1="0" x2="-68" y2="0" stroke="white" stroke-width="5" stroke-linecap="round" />
    
    <!-- Ray 2: Lower Left (~30 deg) -->
    <line x1="-75" y1="-28" x2="-58" y2="-40" stroke="white" stroke-width="5" stroke-linecap="round" />
    
    <!-- Ray 3: Upper Left (~60 deg) -->
    <line x1="-48" y1="-68" x2="-35" y2="-88" stroke="white" stroke-width="5" stroke-linecap="round" />
    
    <!-- Ray 4: Center Top (90 deg vertical) -->
    <line x1="0" y1="-85" x2="0" y2="-110" stroke="white" stroke-width="5" stroke-linecap="round" />
    
    <!-- Ray 5: Upper Right (~60 deg) -->
    <line x1="48" y1="-68" x2="35" y2="-88" stroke="white" stroke-width="5" stroke-linecap="round" />
    
    <!-- Ray 6: Lower Right (~30 deg) -->
    <line x1="75" y1="-28" x2="58" y2="-40" stroke="white" stroke-width="5" stroke-linecap="round" />
    
    <!-- Ray 7: Far Right (horizontal) -->
    <line x1="88" y1="0" x2="68" y2="0" stroke="white" stroke-width="5" stroke-linecap="round" />

    <!-- Top Handle Knob -->
    <path d="M-6 -60 C-6 -65 6 -65 6 -60 C6 -57 3 -55 2 -53 L2 -50 L-2 -50 L-2 -53 C-3 -55 -6 -57 -6 -60 Z" fill="white" />

    <!-- Cloche Left Crescent Highlight (Reflection Cut) -->
    <path d="M -54 0 C -52 -28 -38 -45 -26 -50 C -30 -44 -33 -34 -34 0 Z" fill="white" />

    <!-- Cloche Main Dome -->
    <path d="M -23 0 C -22 -35 -8 -50 0 -50 C 18 -50 54 -35 54 0 Z" fill="white" />

    <!-- Platter Base Tray -->
    <rect x="-60" y="5" width="120" height="7" rx="3.5" fill="white" />
  </g>
</svg>
